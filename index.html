<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fitness House Athens</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: #ffffff;
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -3;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(230, 0, 0, 0.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(230, 0, 0, 0.08),
            transparent 30%
        );

    pointer-events: none;
}

/* Subtle red details */

body::after {
    content: "";
    position: fixed;
    width: 500px;
    height: 2px;

    top: 25%;
    left: -180px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(230, 0, 0, 0.4),
        transparent
    );

    transform: rotate(-25deg);

    opacity: 0.35;

    pointer-events: none;
    z-index: -2;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 480px;

    margin: 0 auto;

    padding:
        25px
        20px
        35px;

    text-align: center;
}

/* =========================
   LOGO
========================= */

.logo-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 12px;
}

.logo {
    width: 330px;
    height: auto;

    max-width: 95vw;

    object-fit: contain;

    display: block;
}

/* =========================
   STORE INFO
========================= */

.store-type {
    font-size: 12px;
    letter-spacing: 4px;

    color: #e60000;

    font-weight: 700;

    margin-top: 2px;
    margin-bottom: 8px;

    text-transform: uppercase;
}

.address {
    font-size: 14px;

    color: #d0d0d0;

    font-weight: 500;

    margin-bottom: 25px;
}

/* =========================
   RED DIVIDER
========================= */

.divider {
    width: 80px;
    height: 2px;

    background: #e60000;

    margin:
        0 auto
        25px;

    opacity: 0.8;
}

/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;
    flex-direction: column;

    gap: 13px;
}

.btn {
    position: relative;

    width: 100%;
    min-height: 62px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 12px;

    padding: 16px 20px;

    color: #ffffff;

    text-decoration: none;

    font-size: 15px;
    font-weight: 700;

    letter-spacing: 0.3px;

    background:
        linear-gradient(
            135deg,
            #111111,
            #181818
        );

    border:
        1px solid
        rgba(230, 0, 0, 0.75);

    border-radius: 13px;

    box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.35);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.btn::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 3px;
    height: 100%;

    background: #e60000;

    border-radius:
        13px 0 0 13px;

    opacity: 0.9;
}

.btn:hover {
    transform: translateY(-2px);

    background:
        linear-gradient(
            135deg,
            #171717,
            #222222
        );

    border-color: #ff0000;

    box-shadow:
        0 8px 25px
        rgba(230, 0, 0, 0.15);
}

.btn:active {
    transform: scale(0.98);
}

/* =========================
   ICONS
========================= */

.icon {
    width: 24px;
    height: 24px;

    flex-shrink: 0;

    color: #e60000;
}

/* =========================
   FOOTER
========================= */

.footer-line {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    margin-top: 32px;
}

.footer-line::before,
.footer-line::after {
    content: "";

    width: 55px;
    height: 1px;

    background:
        rgba(230, 0, 0, 0.55);
}

.footer-symbol {
    color: #e60000;

    font-size: 22px;

    line-height: 1;
}

.tagline {
    margin-top: 15px;

    font-size: 11px;

    letter-spacing: 5px;

    color: #ffffff;

    opacity: 0.7;

    font-weight: 600;
}

.footer {
    margin-top: 24px;

    font-size: 11px;

    color: #777777;

    letter-spacing: 1px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 380px) {

    .container {
        padding-left: 15px;
        padding-right: 15px;
    }

    .logo {
        width: 300px;
    }

    .btn {
        min-height: 58px;

        font-size: 14px;
    }

    .tagline {
        font-size: 9px;
        letter-spacing: 4px;
    }
}

</style>
</head>
